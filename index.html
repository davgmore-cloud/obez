<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дай бог вам здоровья!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Картинка впишется целиком без искажений. Если нужно жестко растянуть, замените на cover */
        }
    </style>
</head>
<body>

    <!-- Ссылка на картинку с гориллой -->
    <img src="https://i.pinimg.com/736x/3d/03/5c/3d035cf5c1dd05be1964b8b58bee16b3.jpg">

</body>
</html>
